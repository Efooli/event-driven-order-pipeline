<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg">
<title>Event-driven order pipeline architecture</title>
<desc>A client sends a request through an Order API, which pushes to an SQS queue. A failed-message path leads to a dead-letter queue. Successful messages are processed and persisted to DynamoDB, then published to an SNS topic that fans out to a Notifier and an Inventory Updater.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="600" fill="#FFFFFF"/>

<line x1="340" y1="84" x2="340" y2="118" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="176" x2="340" y2="214" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="440" y1="244" x2="478" y2="244" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="272" x2="340" y2="310" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<path d="M320 368 L215 406" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M360 368 L465 406" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M450 464 L390 502" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M480 464 L550 502" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="260" y="40" width="160" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Client request</text>
</g>

<g>
<rect x="240" y="120" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Order API</text>
<text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">API Gateway + Lambda</text>
</g>

<g>
<rect x="240" y="216" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="236" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">SQS queue</text>
<text x="340" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Buffers order events</text>
</g>

<g>
<rect x="478" y="216" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="553" y="236" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">Dead-letter queue</text>
<text x="553" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">After 3 failed retries</text>
</g>

<g>
<rect x="240" y="312" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Order processor</text>
<text x="340" y="352" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Validates and persists</text>
</g>

<g>
<rect x="130" y="408" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="215" y="428" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">DynamoDB</text>
<text x="215" y="448" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Order records</text>
</g>

<g>
<rect x="380" y="408" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="465" y="428" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">SNS topic</text>
<text x="465" y="448" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">OrderCreated event</text>
</g>

<g>
<rect x="310" y="504" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="385" y="524" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Notifier</text>
<text x="385" y="544" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Sends email via SES</text>
</g>

<g>
<rect x="480" y="504" width="150" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="555" y="524" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Inventory updater</text>
<text x="555" y="544" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Adjusts stock count</text>
</g>
</svg>
